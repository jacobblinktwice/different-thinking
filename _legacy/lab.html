<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Different Thinking — Glitch Lab</title>
<link rel="stylesheet" href="assets/fonts.css" />
<style>
  :root{
    --paper:#FCFCFC;
    --ink:#0A0A0A;
    --blue:#0022FF;
    --hair:rgba(10,10,10,.12);
    --hair2:rgba(10,10,10,.07);
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:"Neue Montreal","PP Neue Montreal","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    --panelW:392px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#f1f1f0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;}
  button{font-family:inherit;}

  /* ---------------- STAGE ---------------- */
  .stage{position:fixed;inset:0 var(--panelW) 0 0;display:flex;flex-direction:column;background:#f1f1f0;}
  .stage-bar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--hair);background:var(--paper);}
  .stage-bar .logo{font-weight:600;font-size:15px;letter-spacing:-.02em;}
  .stage-bar .logo b{color:var(--blue);}
  .stage-bar .tag{font-family:var(--mono);font-size:11px;color:#888;letter-spacing:-.01em;}
  .stage-bar .sp{flex:1;}
  .seg{display:flex;border:1px solid var(--hair);border-radius:8px;overflow:hidden;}
  .seg button{padding:7px 12px;font-size:12px;background:var(--paper);border:0;border-right:1px solid var(--hair);cursor:pointer;color:#555;letter-spacing:-.01em;transition:.12s;}
  .seg button:last-child{border-right:0;}
  .seg button:hover{background:#f0f0ef;}
  .seg button.act{background:var(--ink);color:var(--paper);}
  .toggle-mini{display:flex;align-items:center;gap:7px;font-size:12px;color:#555;cursor:pointer;user-select:none;}
  .sw{width:30px;height:17px;border-radius:9px;background:#d3d3d1;position:relative;transition:.15s;}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .toggle-mini.on .sw{background:var(--blue);}
  .toggle-mini.on .sw::after{left:15px;}

  .canvas-wrap{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:22px;overflow:hidden;}
  .stageframe{position:relative;width:100%;max-width:calc((100vh - 130px) * 1.7);aspect-ratio:17/10;background:#fff;box-shadow:0 10px 44px rgba(0,0,0,.10);}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #boxlayer{position:absolute;inset:0;pointer-events:none;}
  .boxlabel{position:absolute;pointer-events:auto;cursor:pointer;border:1.5px solid transparent;border-radius:2px;transition:border-color .12s;}
  .boxlabel .tab{position:absolute;top:-1px;left:-1px;font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;
    background:rgba(252,252,252,.82);backdrop-filter:blur(3px);padding:3px 7px;color:#666;border:1px solid var(--hair);border-radius:0 0 6px 0;white-space:nowrap;}
  .boxlabel.sel{border-color:var(--blue);}
  .boxlabel.sel .tab{background:var(--blue);color:#fff;border-color:var(--blue);}

  /* ---------------- PANEL ---------------- */
  .panel{position:fixed;top:0;right:0;bottom:0;width:var(--panelW);z-index:10;background:var(--paper);
    border-left:1px solid var(--hair);display:flex;flex-direction:column;}
  .panel .phead{padding:14px 16px 12px;border-bottom:1px solid var(--hair);}
  .phead .t1{display:flex;align-items:center;gap:10px;}
  .phead .t1 h2{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1;}
  .phead .t1 .cnt{font-family:var(--mono);font-size:11px;color:#999;}
  .phead .subrow{display:flex;align-items:center;gap:8px;margin-top:11px;}
  .boxsel{display:flex;gap:6px;flex:1;}
  .boxsel button{width:30px;height:30px;border-radius:7px;border:1px solid var(--hair);background:var(--paper);cursor:pointer;
    font-size:12.5px;color:#555;display:grid;place-items:center;position:relative;transition:.12s;}
  .boxsel button:hover{border-color:#bbb;}
  .boxsel button.act{border-color:var(--ink);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--ink);}
  .boxsel button .dot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;}
  .addfx{position:relative;}
  .addfx>.plus{width:30px;height:30px;border-radius:7px;border:1px solid var(--hair);background:var(--paper);cursor:pointer;font-size:17px;color:#555;display:grid;place-items:center;line-height:1;}
  .addfx>.plus:hover{border-color:var(--ink);color:var(--ink);}
  .addmenu{position:absolute;right:0;top:36px;z-index:30;background:var(--paper);border:1px solid var(--hair);border-radius:9px;box-shadow:0 10px 34px rgba(0,0,0,.14);padding:5px;display:none;min-width:170px;}
  .addmenu.open{display:block;}
  .addmenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 9px;font-size:13px;background:none;border:0;border-radius:6px;cursor:pointer;color:#333;}
  .addmenu button:hover{background:#f0f0ef;}

  .pbody{overflow-y:auto;flex:1 1 0;min-height:0;padding:10px;display:flex;flex-direction:column;gap:8px;}
  .pbody::-webkit-scrollbar{width:9px;}
  .pbody::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16);border-radius:5px;border:2px solid var(--paper);}

  .fx{border:1px solid var(--hair);border-radius:10px;background:var(--paper);overflow:hidden;transition:opacity .15s,border-color .12s,box-shadow .12s;}
  .fx.off{opacity:.5;}
  .fx.drag{opacity:.4;}
  .fx.dragover{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);}
  .fx .row{display:flex;align-items:center;gap:8px;padding:10px 10px;user-select:none;}
  .fx .grip{cursor:grab;color:#bbb;font-size:13px;letter-spacing:-2px;padding:0 1px;line-height:1;}
  .fx .grip:active{cursor:grabbing;}
  .fx .wave{font-size:14px;color:#444;line-height:1;}
  .fx .name{flex:1;font-size:13.5px;letter-spacing:-.01em;cursor:pointer;}
  .fx .idxnum{font-family:var(--mono);font-size:10px;color:#bbb;margin-right:2px;}
  .fx .eye,.fx .del,.fx .caret{width:25px;height:25px;display:grid;place-items:center;border-radius:6px;color:#555;cursor:pointer;transition:.12s;}
  .fx .eye:hover,.fx .del:hover,.fx .caret:hover{background:rgba(0,0,0,.06);}
  .fx.off .eye{color:#c0c0c0;}
  .fx .caret i{display:inline-block;transition:transform .18s;font-style:normal;color:#888;}
  .fx.open .caret i{transform:rotate(90deg);}
  .fx .items{display:none;flex-direction:column;gap:9px;padding:4px 13px 14px;}
  .fx.open .items{display:flex;}

  .ctl{display:grid;grid-template-columns:74px 1fr 46px;gap:8px;align-items:center;}
  .ctl>label{font-size:11.5px;color:#444;letter-spacing:-.01em;}
  .ctl .val{font-family:var(--mono);font-size:10.5px;color:#666;text-align:right;font-variant-numeric:tabular-nums;}
  .ctl input[type=range]{width:100%;height:16px;-webkit-appearance:none;background:transparent;cursor:pointer;}
  .ctl input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,var(--ink) 0 var(--fill,0%),var(--hair) var(--fill,0%) 100%);}
  .ctl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);margin-top:-5px;transition:background .1s,transform .1s;}
  .ctl input[type=range]:active::-webkit-slider-thumb{background:var(--blue);border-color:var(--blue);transform:scale(1.15);}
  .ctl input[type=range]::-moz-range-track{height:2px;background:var(--hair);}
  .ctl input[type=range]::-moz-range-thumb{width:11px;height:11px;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper);}

  .ctl select{grid-column:2/4;font-family:var(--sans);font-size:12px;padding:5px 7px;border:1px solid var(--hair);border-radius:6px;background:var(--paper);color:#222;cursor:pointer;}
  .ctl.wide{grid-template-columns:74px 1fr;}
  .ctl .toggle-mini{grid-column:2/4;}
  .ctl .colorbox{grid-column:2/4;display:flex;align-items:center;gap:8px;}
  .ctl .colorbox input[type=color]{width:26px;height:22px;padding:0;border:1px solid var(--hair);border-radius:5px;background:none;cursor:pointer;}
  .ctl .colorbox .hex{font-family:var(--mono);font-size:11px;color:#555;}

  .grad{grid-column:1/4;}
  .grad .glabel{font-size:11.5px;color:#444;margin-bottom:5px;}
  .grad .bar{height:22px;border-radius:5px;border:1px solid var(--hair);}
  .grad .stops{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
  .grad .stop{display:flex;align-items:center;gap:4px;}
  .grad .stop input[type=color]{width:22px;height:20px;padding:0;border:1px solid var(--hair);border-radius:4px;background:none;cursor:pointer;}
  .grad .stop .sd{font-family:var(--mono);font-size:9px;color:#aaa;}

  .subhead{grid-column:1/4;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#aaa;margin:3px 0 -2px;}

  .pfoot{border-top:1px solid var(--hair);padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:9px 6px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;transition:.12s;border-radius:7px;}
  .btn:hover{background:var(--ink);color:var(--paper);}
  .btn.blue{border-color:var(--blue);color:var(--blue);}
  .btn.blue:hover{background:var(--blue);color:#fff;}
  .btn.wide{grid-column:1/3;}

  .toast{position:fixed;bottom:16px;left:16px;z-index:80;background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:11px;padding:9px 13px;border-radius:7px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}

  /* copy-from select styled as a footer button */
  select.btn{-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center;}

  /* ---------------- LANDING VIEW (in-document preview) ---------------- */
  .landing-chrome{position:absolute;inset:0;z-index:3;pointer-events:none;display:none;font-family:var(--sans);color:var(--ink);}
  body.landing .landing-chrome{display:block;}
  body.landing .panel{display:none;}
  body.landing .stage{right:0;}
  body.landing .canvas-wrap{padding:0;}
  body.landing .stageframe{max-width:none;width:100%;height:100%;aspect-ratio:auto;box-shadow:none;}
  body.landing #boxlayer{display:none;}
  .lc-brand{position:absolute;left:clamp(16px,3vw,40px);top:clamp(14px,3vh,30px);font-size:clamp(16px,1.8vw,25px);font-weight:500;letter-spacing:-.02em;}
  .lc-nav{position:absolute;right:clamp(16px,3vw,40px);top:clamp(14px,3vh,30px);display:grid;grid-template-columns:auto auto;gap:6px 14px;font-size:14px;letter-spacing:-.01em;}
  .lc-nav span:nth-child(odd){font-family:var(--mono);font-size:11px;color:#666;}
  .lc-code{position:absolute;left:0;right:0;bottom:clamp(12px,3vh,26px);display:flex;justify-content:space-between;padding:0 clamp(16px,3vw,40px);font-family:var(--mono);font-size:14px;color:#222;}
  .lc-code .mid{margin-left:-14vw;}
  .lc-word{position:absolute;left:2%;right:2%;bottom:9%;z-index:2;mix-blend-mode:difference;display:none;pointer-events:none;}
  body.landing .lc-word{display:block;}
  .lc-word svg{width:100%;height:auto;display:block;}
  .lc-word svg path{fill:#fff !important;}
</style>
</head>
<body>

<div class="stage">
  <div class="stage-bar">
    <div class="logo">Different <b>Thinking</b></div>
    <div class="tag">glitch lab · specimens 01–04</div>
    <div class="sp"></div>
    <label class="toggle-mini on" id="gridToggle"><span class="sw"></span>Grid</label>
    <div class="seg" id="viewSeg">
      <button data-v="lab" class="act">Lab</button>
      <button data-v="landing">Landing</button>
    </div>
  </div>
  <div class="canvas-wrap">
    <div class="stageframe" id="stageframe">
      <canvas id="gl"></canvas>
      <div id="boxlayer"></div>
      <div class="lc-word" id="lcWord"></div>
      <div class="landing-chrome" id="landingChrome">
        <div class="lc-brand">Your Bugs are Cool.</div>
        <nav class="lc-nav">
          <span>[01]</span><span>About</span><span>[02]</span><span>Different Thinkers</span>
          <span>[03]</span><span>Alex</span><span>[04]</span><span>Specimen</span>
        </nav>
        <div class="lc-code"><span>{reSrch}</span><span class="mid">; @}</span><span>&lt;"aiLab"&gt;</span></div>
      </div>
    </div>
  </div>
</div>

<aside class="panel">
  <div class="phead">
    <div class="t1"><span class="wave">≈</span><h2>Effects</h2><span class="cnt" id="fxcnt"></span></div>
    <div class="subrow">
      <div class="boxsel" id="boxsel"></div>
      <div class="addfx">
        <button class="plus" id="addBtn" title="Add effect">+</button>
        <div class="addmenu" id="addMenu"></div>
      </div>
    </div>
  </div>
  <div class="pbody" id="stack"></div>
  <div class="pfoot">
    <button class="btn blue" id="rand">Randomize</button>
    <button class="btn" id="reset">Reset box</button>
    <button class="btn" id="copyall">Copy → all</button>
    <select class="btn" id="copyFrom" title="Copy another box's effects into this box">
      <option value="">Copy from…</option>
      <option value="0">From Box 1</option>
      <option value="1">From Box 2</option>
      <option value="2">From Box 3</option>
      <option value="3">From Box 4</option>
    </select>
    <button class="btn" id="pause">Pause</button>
    <button class="btn" id="export">Export JSON</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   Different Thinking — Glitch Lab
   Per-box, reorderable, multi-pass (ping-pong) WebGL effect pipeline.
   Effects: Chromatic metal · Gradient map · Pattern refraction ·
            Slice shift · Dither  — each an independent shader pass.
   ===================================================================== */

/* ---------- shared GLSL ---------- */
const VERT = `attribute vec2 a_pos;void main(){gl_Position=vec4(a_pos,0.0,1.0);}`;

const COMMON = `
precision highp float;
uniform vec2 u_res;
uniform float u_time;
uniform vec2 u_px;
const float PI=3.14159265;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float hash11(float p){p=fract(p*0.1031);p*=p+33.33;p*=p+p;return fract(p);}
float hash21(vec2 p){vec3 q=fract(vec3(p.xyx)*0.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.0-2.0*f);
  float a=hash21(i),b=hash21(i+vec2(1,0)),c=hash21(i+vec2(0,1)),d=hash21(i+vec2(1,1));
  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}
// multi-stop gradient (piecewise linear, up to 5 stops)
uniform vec3 u_gcol[5];
uniform float u_gpos[5];
uniform int u_gcount;
vec3 sampleGrad(float t){
  t=clamp(t,0.0,1.0);
  vec3 c=u_gcol[0];
  for(int i=0;i<4;i++){
    if(i+1<u_gcount){
      float seg=clamp((t-u_gpos[i])/max(u_gpos[i+1]-u_gpos[i],1e-4),0.0,1.0);
      c=mix(c,u_gcol[i+1],seg);
    }
  }
  return c;
}
`;

/* base fill: a soft vertical luminance ramp so colour effects always have signal */
const FRAG_FILL = COMMON + `
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  float g=0.16+uv.y*0.66;
  gl_FragColor=vec4(vec3(g),1.0);
}`;

/* Chromatic metal — generative liquid-chrome field (ignores input) */
const FRAG_METAL = COMMON + `
uniform float u_scale,u_stretch,u_angle,u_rough,u_rgbsplit,u_depth,u_repeats,u_offset,u_phase,u_evo,u_speed;
float fbm(vec2 p){
  float s=0.0,amp=0.5,tot=0.0;
  for(int i=0;i<6;i++){s+=amp*vnoise(p);tot+=amp;p=p*2.03+vec2(11.3,7.7);amp*=mix(0.34,0.62,u_rough);}
  return s/tot;
}
float field(vec2 uv,float chan){
  float ang=u_angle*PI/180.0;
  vec2 p=rot(ang)*(uv-0.5);
  p.x*=(0.2+u_stretch/100.0);
  p*=mix(1.0,15.0,u_scale/100.0);
  p+=u_phase/100.0*6.2831;
  p+=u_evo/100.0*7.0;                       // evolution = static seed offset
  p+=chan*u_rgbsplit/100.0*0.5;
  float t=u_time*u_speed/100.0*0.6;         // speed drives subtle movement (0 = static)
  vec2 w=vec2(fbm(p+t),fbm(p.yx-t*0.8));
  float f=fbm(p+w*2.4);
  f=fract(f*max(u_repeats,1.0)+u_offset/100.0);
  // depth -> contrast around 0.5
  f=clamp((f-0.5)*(0.4+u_depth/100.0*1.6)+0.5,0.0,1.0);
  return f;
}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  float r=field(uv,-1.0), g=field(uv,0.0), b=field(uv,1.0);
  vec3 col=vec3(sampleGrad(r).r,sampleGrad(g).g,sampleGrad(b).b);
  gl_FragColor=vec4(col,1.0);
}`;

/* Pixel stretch — hold pixels at an axis line, smearing them into streaks */
const FRAG_PIXSTRETCH = COMMON + `
uniform sampler2D u_src;
uniform float u_offset,u_smooth,u_falloff,u_tx,u_ty,u_prot,u_pangle;
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec2 pivot=vec2(u_tx,u_ty)/100.0;
  float ang=(u_pangle+u_prot)*PI/180.0;
  vec2 dir=vec2(cos(ang),sin(ang));
  float off=u_offset/100.0;
  float sm=u_smooth/100.0;
  float fall=u_falloff/100.0;
  float t=dot(uv-pivot,dir);
  float d=t-off;                                   // signed distance past the line
  float pull = sm>0.001 ? smoothstep(0.0,sm,abs(d)) : 1.0;
  if(fall>0.001) pull *= (1.0-smoothstep(0.0,fall,abs(d)));
  float side = (off>=0.0) ? step(off,t) : step(t,off);
  pull *= side;
  vec2 sampleUV = uv - dir*(d*pull);               // pull sample back to the line
  gl_FragColor=texture2D(u_src,clamp(sampleUV,0.0,1.0));
}`;

/* Gradient map — remap luminance through gradient */
const FRAG_GRADMAP = COMMON + `
uniform sampler2D u_src;
uniform float u_scatter,u_offset,u_repeatType,u_repeatFreq,u_mixSpace;
float toLin(float c){return c<=0.04045?c/12.92:pow((c+0.055)/1.055,2.4);}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec3 s=texture2D(u_src,uv).rgb;
  vec3 lc=(u_mixSpace>0.5)?vec3(toLin(s.r),toLin(s.g),toLin(s.b)):s;
  float L=dot(lc,vec3(0.299,0.587,0.114));
  float j=(hash21(floor(uv*u_px))-0.5)*u_scatter/100.0*0.5;
  float t=L*max(u_repeatFreq,1.0)+u_offset/100.0+j;
  if(u_repeatType<0.5){ t=clamp(t,0.0,1.0); }              // none
  else if(u_repeatType<1.5){ t=fract(t); }                  // repeat
  else { t=abs(fract(t*0.5)*2.0-1.0); }                     // mirror
  gl_FragColor=vec4(sampleGrad(t),1.0);
}`;

/* Pattern refraction — displace sampling by a pattern, with dispersion + frost */
const FRAG_REFRACT = COMMON + `
uniform sampler2D u_src;
uniform float u_pattern,u_strength,u_smooth,u_frost,u_disp,u_edge;
uniform float u_tx,u_ty,u_pscale,u_pangle;
vec2 wrapUV(vec2 uv){
  if(u_edge<0.5) return clamp(uv,0.0,1.0);                   // clamp
  else if(u_edge<1.5) return fract(uv);                      // repeat
  else return abs(fract(uv*0.5)*2.0-1.0);                    // mirror
}
float pat(vec2 p){
  if(u_pattern<0.5){                                         // waves
    return sin(p.x*6.2831+p.y*2.0)*0.5+cos(p.y*6.2831)*0.5;
  } else if(u_pattern<1.5){                                  // rings
    return sin(length(p-0.5)*30.0);
  } else if(u_pattern<2.5){                                  // grid
    return sign(sin(p.x*18.0)*sin(p.y*18.0));
  }
  return vnoise(p*8.0)*2.0-1.0;                              // noise
}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec2 c=vec2(u_tx,u_ty)/100.0;
  vec2 q=rot(u_pangle*PI/180.0)*(uv-c);
  q*=mix(0.5,4.0,u_pscale);
  float sm=mix(1.0,6.0,u_smooth/100.0);
  vec2 grad=vec2(pat(q+vec2(0.01,0.0))-pat(q-vec2(0.01,0.0)),
                 pat(q+vec2(0.0,0.01))-pat(q-vec2(0.0,0.01)))/(0.02*sm);
  vec2 disp=grad*(u_strength/100.0)*0.18;
  vec2 fr=(vec2(hash21(floor(uv*u_px)),hash21(floor(uv*u_px)+7.3))-0.5)*u_frost/100.0*0.03;
  float d=u_disp/100.0*0.5;
  vec3 col;
  col.r=texture2D(u_src,wrapUV(uv+disp*(1.0+d)+fr)).r;
  col.g=texture2D(u_src,wrapUV(uv+disp+fr)).g;
  col.b=texture2D(u_src,wrapUV(uv+disp*(1.0-d)+fr)).b;
  gl_FragColor=vec4(col,1.0);
}`;

/* Slice shift — horizontal rows displaced by seeded random */
const FRAG_SLICE = COMMON + `
uniform sampler2D u_src;
uniform float u_shift,u_soft,u_random,u_tx,u_ty,u_srot,u_sangle,u_speed,u_glitch;
float rowShift(float row){
  // smooth drift: interpolate between successive random states over time (Speed)
  float t=u_time*u_speed*0.2;
  float a=hash11(row*1.7+u_random+floor(t));
  float b=hash11(row*1.7+u_random+floor(t)+1.0);
  float sh=(mix(a,b,smoothstep(0.0,1.0,fract(t)))-0.5)*u_shift/100.0;
  // glitchy movement: stepped random bursts that jump rows (Glitch)
  float g=u_glitch/100.0;
  float gt=floor(u_time*(3.0+g*22.0));
  float gate=step(1.0-g*0.75,hash11(gt*1.7+row*0.37));
  sh+=(hash11(gt+row*2.3)-0.5)*g*(u_shift/100.0)*2.5*gate;
  return sh;
}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec2 c=vec2(u_tx,u_ty)/100.0;
  vec2 p=rot(u_srot*PI/180.0)*(uv-c)+c;
  float N=8.0+floor(mod(u_random,40.0))+8.0;
  float rowf=p.y*N;
  float row=floor(rowf);
  float frac=fract(rowf);
  float sh=rowShift(row);
  float shN=rowShift(row+1.0);
  float soft=u_soft/100.0;
  float blend=soft<=0.001?0.0:smoothstep(1.0-soft,1.0,frac);
  float s=mix(sh,shN,blend);
  vec2 dir=rot(u_sangle*PI/180.0)*vec2(1.0,0.0);
  gl_FragColor=texture2D(u_src,clamp(uv+dir*s,0.0,1.0));
}`;

/* Dither — ordered Bayer quantization */
const FRAG_DITHER = COMMON + `
uniform sampler2D u_src;
uniform float u_style,u_size,u_levels,u_bright,u_contrast,u_mono;
uniform vec3 u_monoCol;
float bayer2(vec2 a){a=floor(a);return fract(a.x/2.0+a.y*a.y*0.75);}
float bayer4(vec2 a){return bayer2(0.5*a)*0.25+bayer2(a);}
float bayer8(vec2 a){return bayer4(0.5*a)*0.25+bayer2(a);}
void main(){
  vec2 uv=gl_FragCoord.xy/u_res;
  vec3 c=texture2D(u_src,uv).rgb;
  c=(c-0.5)*u_contrast+0.5;              // contrast
  c*=u_bright/100.0;                     // brightness
  c=clamp(c,0.0,1.0);
  vec2 pc=uv*u_px/max(u_size,1.0);
  float th;
  if(u_style<0.5) th=bayer2(pc);
  else if(u_style<1.5) th=bayer4(pc);
  else th=bayer8(pc);
  th-=0.5;
  float lv=max(u_levels,2.0)-1.0;
  if(u_mono>0.5){
    float L=dot(c,vec3(0.299,0.587,0.114));
    L=floor(L*lv+0.5+th)/lv;
    gl_FragColor=vec4(u_monoCol*L,1.0);
  } else {
    c=floor(c*lv+0.5+th)/lv;
    gl_FragColor=vec4(c,1.0);
  }
}`;

/* Composite blit — draw a box texture to screen with rounded-corner mask */
const FRAG_BLIT = COMMON + `
uniform sampler2D u_src;
uniform vec2 u_origin;   // rect origin in device px (from bottom-left)
uniform vec2 u_size;     // rect size in device px
uniform float u_round;   // corner radius 0..1 of half-min-dim
uniform float u_opacity;
void main(){
  vec2 local=(gl_FragCoord.xy-u_origin)/u_size;   // 0..1
  vec3 col=texture2D(u_src,local).rgb;
  // rounded rect coverage
  vec2 halfpx=u_size*0.5;
  float r=u_round*min(halfpx.x,halfpx.y);
  vec2 pxy=(local-0.5)*u_size;                    // px from center
  vec2 d=abs(pxy)-(halfpx-r);
  float dist=length(max(d,0.0))+min(max(d.x,d.y),0.0)-r;
  float a=(1.0-smoothstep(-1.0,1.0,dist))*u_opacity;
  gl_FragColor=vec4(col,a);
}`;

/* ping-pong FBOs */
function makeFBO(w,h){
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const fb=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  return {fb,tex,w,h};
}
let ping=null,pong=null,fboW=0,fboH=0;
function ensureFBO(w,h){
  if(w===fboW&&h===fboH&&ping) return;
  if(ping){gl.deleteTexture(ping.tex);gl.deleteFramebuffer(ping.fb);gl.deleteTexture(pong.tex);gl.deleteFramebuffer(pong.fb);}
  fboW=w;fboH=h;
  ping=makeFBO(w,h);pong=makeFBO(w,h);
}

/* gradient -> uniforms */
function setGrad(prog,grad){
  const cols=[],pos=[];
  const g=grad||[{p:0,c:'#000'},{p:1,c:'#fff'}];
  for(let i=0;i<5;i++){
    const s=g[Math.min(i,g.length-1)];
    const rgb=hex2rgb(s.c);
    cols.push(rgb[0],rgb[1],rgb[2]);
    pos.push(g[i]?g[i].p:1);
  }
  gl.uniform3fv(gl.getUniformLocation(prog,'u_gcol'),cols);
  gl.uniform1fv(gl.getUniformLocation(prog,'u_gpos'),pos);
  gl.uniform1i(gl.getUniformLocation(prog,'u_gcount'),Math.min(g.length,5));
}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.substr(0,2),16)/255,parseInt(h.substr(2,2),16)/255,parseInt(h.substr(4,2),16)/255];}

function U(prog,name){return gl.getUniformLocation(prog,name);}
function setF(prog,name,v){const l=U(prog,name);if(l)gl.uniform1f(l,v);}

    setF(prog,'u_scale',p.scale);setF(prog,'u_stretch',p.stretch);setF(prog,'u_angle',p.angle);
    setF(prog,'u_rough',p.rough);setF(prog,'u_rgbsplit',p.rgbsplit);setF(prog,'u_depth',p.depth);
    setF(prog,'u_repeats',p.repeats);setF(prog,'u_offset',p.offset);setF(prog,'u_phase',p.phase);setF(prog,'u_evo',p.evo);
    setF(prog,'u_speed',p.speed);
  } else if(type==='pixstretch'){
    setF(prog,'u_offset',p.offset);setF(prog,'u_smooth',p.smooth);setF(prog,'u_falloff',p.falloff);
    setF(prog,'u_tx',p.tx);setF(prog,'u_ty',p.ty);setF(prog,'u_prot',p.prot);setF(prog,'u_pangle',p.pangle);
  } else if(type==='gradmap'){
    setGrad(prog,e.grad);
    setF(prog,'u_scatter',p.scatter);setF(prog,'u_offset',p.offset);
    setF(prog,'u_repeatType',p.repeatType);setF(prog,'u_repeatFreq',p.repeatFreq);setF(prog,'u_mixSpace',p.mixSpace);
  } else if(type==='refract'){
    setF(prog,'u_pattern',p.pattern);setF(prog,'u_strength',p.strength);setF(prog,'u_smooth',p.smooth);
    setF(prog,'u_frost',p.frost);setF(prog,'u_disp',p.disp);setF(prog,'u_edge',p.edge);
    setF(prog,'u_tx',p.tx);setF(prog,'u_ty',p.ty);setF(prog,'u_pscale',p.pscale/100);setF(prog,'u_pangle',p.pangle);
  } else if(type==='slice'){
    setF(prog,'u_shift',p.shift);setF(prog,'u_soft',p.soft);setF(prog,'u_random',p.random);
    setF(prog,'u_tx',p.tx);setF(prog,'u_ty',p.ty);setF(prog,'u_srot',p.srot);setF(prog,'u_sangle',p.sangle);
    setF(prog,'u_speed',p.speed||0);setF(prog,'u_glitch',p.glitch||0);
  } else if(type==='dither'){
    setF(prog,'u_style',p.style);setF(prog,'u_size',p.size);setF(prog,'u_levels',p.levels);
    setF(prog,'u_bright',p.bright);setF(prog,'u_contrast',p.contrast);setF(prog,'u_mono',p.mono?1:0);
    const rgb=hex2rgb(p.monoCol||'#ffffff');gl.uniform3f(U(prog,'u_monoCol'),rgb[0],rgb[1],rgb[2]);
  }
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* render one box's full chain, return the texture holding the result */
function renderBoxChain(box,res){
  ensureFBO(res.w,res.h);
  gl.disable(gl.BLEND);
  // base fill -> ping
  gl.bindFramebuffer(gl.FRAMEBUFFER,ping.fb);
  gl.viewport(0,0,res.w,res.h);
  drawPass('fill',null,null,res);
  let src=ping,dst=pong;
  // process bottom→top (Figma convention): reverse of displayed list
  const chain=box.effects.slice().reverse().filter(e=>e.on);
  for(const e of chain){
    gl.bindFramebuffer(gl.FRAMEBUFFER,dst.fb);
    gl.viewport(0,0,res.w,res.h);
    drawPass(e.type,e,src.tex,res);
    const tmp=src;src=dst;dst=tmp;
  }
  return src.tex;
}

/* freeform box rects in CSS px, from each box's normalized layout */
let rects=[];
function computeRects(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  rects=boxes.map(b=>({x:b.layout.x*w,y:b.layout.y*h,w:b.layout.w*w,h:b.layout.h*h}));
}

const DPR=()=>Math.min(window.devicePixelRatio||1,2);
function resize(){
  const w=canvas.clientWidth,h=canvas.clientHeight,dpr=DPR();
  const cw=Math.floor(w*dpr),ch=Math.floor(h*dpr);
  if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch;}
  computeRects();
  positionLabels();
}

let showGrid=true, landingMode=false;
let running=true,elapsed=0,tPrev=0;

/* composite a box texture to the screen at a CSS-px rect */
function blitToScreen(tex,rCss,round,opacity,dpr){
  const res={w:Math.max(2,Math.floor(rCss.w*dpr)),h:Math.max(2,Math.floor(rCss.h*dpr))};
  const ox=Math.floor(rCss.x*dpr), oy=canvas.height-Math.floor(rCss.y*dpr)-res.h;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(ox,oy,res.w,res.h);
  const prog=PROG.blit;gl.useProgram(prog);bindAttr(prog);
  gl.uniform2f(U(prog,'u_res'),canvas.width,canvas.height);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(U(prog,'u_src'),0);
  gl.uniform2f(U(prog,'u_origin'),ox,oy);gl.uniform2f(U(prog,'u_size'),res.w,res.h);
  gl.uniform1f(U(prog,'u_round'),round||0);gl.uniform1f(U(prog,'u_opacity'),opacity==null?1:opacity);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function boxRound(box){const m=box.effects.find(e=>e.type==='metal');return m?(m.params.rounding/100):0;}

/* echo (duplicate) helpers — slice + pixel-stretch applied last, placed below the box */
const echoExtras=[ makeEffect('pixstretch',{params:{offset:40,pangle:0,prot:0,smooth:28}}),
                   makeEffect('slice',{params:{shift:24,random:180}}) ];
function echoRectCss(L){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  return {x:L.x*w, y:Math.min(L.y+L.h*0.5,0.9)*h, w:L.w*w, h:Math.max(L.h*0.85,0.14)*h};
}

function renderLab(dpr){
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0.945,0.945,0.941,1.0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  for(let i=0;i<4;i++){
    const tex=renderBoxChain(boxes[i],{w:Math.max(2,Math.floor(rects[i].w*dpr)),h:Math.max(2,Math.floor(rects[i].h*dpr))});
    blitToScreen(tex,rects[i],boxRound(boxes[i]),1,dpr);
  }
}
function renderLanding(dpr){
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0.988,0.988,0.988,1.0);gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  // echoes (behind)
  for(let i=0;i<4;i++){
    const er=echoRectCss(boxes[i].layout);
    const res={w:Math.max(2,Math.floor(er.w*dpr)),h:Math.max(2,Math.floor(er.h*dpr))};
    const tex=renderBoxChain({effects:echoExtras.concat(boxes[i].effects)},res);
    blitToScreen(tex,er,0,0.92,dpr);
  }
  // mains (front)
  for(let i=0;i<4;i++){
    const tex=renderBoxChain(boxes[i],{w:Math.max(2,Math.floor(rects[i].w*dpr)),h:Math.max(2,Math.floor(rects[i].h*dpr))});
    blitToScreen(tex,rects[i],boxRound(boxes[i]),1,dpr);
  }
}
function frame(now){
  now/=1000;if(!tPrev)tPrev=now;const dt=Math.min(now-tPrev,0.05);tPrev=now;
  if(running)elapsed+=dt;
  resize();
  const dpr=DPR();
  if(landingMode) renderLanding(dpr); else renderLab(dpr);
  requestAnimationFrame(frame);
}

/* =====================================================================
   Box labels / selection overlay
   ===================================================================== */
const boxlayer=document.getElementById('boxlayer');
const labelEls=[];
for(let i=0;i<4;i++){
  const d=document.createElement('div');
  d.className='boxlabel'+(i===active?' sel':'');
  d.innerHTML=`<span class="tab">[0${i+1}] ${BOX_META[i].name}</span>`;
  d.addEventListener('click',()=>selectBox(i));
  boxlayer.appendChild(d);labelEls.push(d);
}
function positionLabels(){
  for(let i=0;i<4;i++){
    const r=rects[i];const d=labelEls[i];
    d.style.left=r.x+'px';d.style.top=r.y+'px';d.style.width=r.w+'px';d.style.height=r.h+'px';
    d.style.display=showGrid?'block':'none';
  }
}

/* =====================================================================
   Control panel UI
   ===================================================================== */
const boxsel=document.getElementById('boxsel');
for(let i=0;i<4;i++){
  const b=document.createElement('button');
  b.innerHTML=`${i+1}<span class="dot" style="background:${BOX_META[i].dot}"></span>`;
  b.addEventListener('click',()=>selectBox(i));
  boxsel.appendChild(b);
}
function selectBox(i){
  active=i;
  [...boxsel.children].forEach((b,j)=>b.classList.toggle('act',j===i));
  labelEls.forEach((d,j)=>d.classList.toggle('sel',j===i));
  buildStack();
}

const EYE=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
const EYEOFF=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s4-7 11-7c2 0 3.8.5 5.3 1.3M22 12s-4 7-11 7c-2 0-3.8-.5-5.3-1.3"/><path d="M3 3l18 18"/></svg>`;

const stack=document.getElementById('stack');
const fmt=(v,step)=> step<1 ? (+v).toFixed(step<0.05?2:1) : String(Math.round(v));

function layoutCard(box){
  const fx=document.createElement('div'); fx.className='fx open';
  const row=document.createElement('div'); row.className='row';
  row.innerHTML=`<span class="wave">⧉</span><span class="name">Layout &amp; size</span><span class="caret"><i>›</i></span>`;
  const tog=()=>fx.classList.toggle('open');
  row.querySelector('.name').addEventListener('click',tog);
  row.querySelector('.caret').addEventListener('click',tog);
  fx.appendChild(row);
  const items=document.createElement('div'); items.className='items';
  [['x','X',0,100],['y','Y',0,100],['w','Width',2,100],['h','Height',2,100]].forEach(([k,label,min,max])=>{
    const ctl=document.createElement('div'); ctl.className='ctl';
    const lab=document.createElement('label'); lab.textContent=label;
    const val=document.createElement('span'); val.className='val';
    const inp=document.createElement('input'); inp.type='range'; inp.min=min; inp.max=max; inp.step=0.1;
    inp.value=(box.layout[k]*100).toFixed(1); val.textContent=(+inp.value).toFixed(1)+'%';
    const fill=()=>inp.style.setProperty('--fill',((inp.value-min)/(max-min)*100)+'%'); fill();
    inp.addEventListener('input',()=>{box.layout[k]=parseFloat(inp.value)/100;val.textContent=(+inp.value).toFixed(1)+'%';fill();computeRects();positionLabels();});
    ctl.appendChild(lab); ctl.appendChild(inp); ctl.appendChild(val); items.appendChild(ctl);
  });
  fx.appendChild(items); return fx;
}

function buildStack(){
  const box=boxes[active];
  stack.innerHTML='';
  stack.appendChild(layoutCard(box));
  document.getElementById('fxcnt').textContent=box.effects.filter(e=>e.on).length+'/'+box.effects.length;
  box.effects.forEach((e,idx)=>{
    const def=SCHEMA[e.type];
    const fx=document.createElement('div');
    fx.className='fx'+(e.on?'':' off');
    fx.draggable=false;
    // ROW
    const row=document.createElement('div');row.className='row';
    row.innerHTML=`<span class="grip" title="Drag to reorder">⋮⋮</span>
      <span class="idxnum">${idx+1}</span>
      <span class="wave">≈</span>
      <span class="name">${def.name}</span>
      <span class="eye">${e.on?EYE:EYEOFF}</span>
      <span class="del" title="Remove">–</span>
      <span class="caret"><i>›</i></span>`;
    row.querySelector('.eye').addEventListener('click',ev=>{ev.stopPropagation();e.on=!e.on;fx.classList.toggle('off',!e.on);
      row.querySelector('.eye').innerHTML=e.on?EYE:EYEOFF;
      document.getElementById('fxcnt').textContent=box.effects.filter(x=>x.on).length+'/'+box.effects.length;scheduleSave();});
    row.querySelector('.del').addEventListener('click',ev=>{ev.stopPropagation();
      box.effects.splice(idx,1);buildStack();});
    const toggleOpen=()=>fx.classList.toggle('open');
    row.querySelector('.name').addEventListener('click',toggleOpen);
    row.querySelector('.caret').addEventListener('click',toggleOpen);
    // drag reorder via grip
    const grip=row.querySelector('.grip');
    grip.addEventListener('mousedown',()=>{fx.draggable=true;});
    fx.addEventListener('dragstart',ev=>{fx.classList.add('drag');ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',idx);dragIdx=idx;});
    fx.addEventListener('dragend',()=>{fx.classList.remove('drag');fx.draggable=false;clearDragOver();});
    fx.addEventListener('dragover',ev=>{ev.preventDefault();fx.classList.add('dragover');});
    fx.addEventListener('dragleave',()=>fx.classList.remove('dragover'));
    fx.addEventListener('drop',ev=>{ev.preventDefault();fx.classList.remove('dragover');
      if(dragIdx===null||dragIdx===idx)return;
      const moved=box.effects.splice(dragIdx,1)[0];
      box.effects.splice(idx,0,moved);dragIdx=null;buildStack();});
    fx.appendChild(row);
    // ITEMS
    const items=document.createElement('div');items.className='items';
    if(def.hasGrad) items.appendChild(gradientCtl(e));
    for(const key in def.params){
      const p=def.params[key];
      if(key==='__t'){const h=document.createElement('div');h.className='subhead';h.textContent=p;items.appendChild(h);continue;}
      items.appendChild(paramCtl(e,key,p));
    }
    fx.appendChild(items);
    stack.appendChild(fx);
  });
}
let dragIdx=null;
function clearDragOver(){[...stack.querySelectorAll('.fx')].forEach(f=>f.classList.remove('dragover'));}

function paramCtl(e,key,p){
  const ctl=document.createElement('div');ctl.className='ctl';
  if(p.type==='select'){
    ctl.classList.add('wide');
    ctl.innerHTML=`<label>${p.options?'':''}</label>`;
    const lab=document.createElement('label');lab.textContent=SCHEMA_LABEL(key);ctl.innerHTML='';ctl.appendChild(lab);
    const sel=document.createElement('select');
    p.options.forEach((o,i)=>{const op=document.createElement('option');op.value=i;op.textContent=o;sel.appendChild(op);});
    sel.value=e.params[key];
    sel.addEventListener('change',()=>e.params[key]=parseInt(sel.value));
    ctl.appendChild(sel);
    return ctl;
  }
  if(p.type==='toggle'){
    ctl.classList.add('wide');
    const lab=document.createElement('label');lab.textContent=p.label;ctl.appendChild(lab);
    const t=document.createElement('label');t.className='toggle-mini'+(e.params[key]?' on':'');
    t.innerHTML=`<span class="sw"></span>`;
    t.addEventListener('click',()=>{e.params[key]=!e.params[key];t.classList.toggle('on',e.params[key]);scheduleSave();});
    ctl.appendChild(t);return ctl;
  }
  if(p.type==='color'){
    ctl.classList.add('wide');
    const lab=document.createElement('label');lab.textContent=p.label;ctl.appendChild(lab);
    const wrap=document.createElement('div');wrap.className='colorbox';
    const c=document.createElement('input');c.type='color';c.value=e.params[key];
    const hex=document.createElement('span');hex.className='hex';hex.textContent=e.params[key].toUpperCase();
    c.addEventListener('input',()=>{e.params[key]=c.value;hex.textContent=c.value.toUpperCase();});
    wrap.appendChild(c);wrap.appendChild(hex);ctl.appendChild(wrap);return ctl;
  }
  // numeric slider
  const lab=document.createElement('label');lab.textContent=p.label;
  const val=document.createElement('span');val.className='val';val.textContent=fmt(e.params[key],p.step)+p.unit;
  const inp=document.createElement('input');inp.type='range';inp.min=p.min;inp.max=p.max;inp.step=p.step;inp.value=e.params[key];
  const fill=()=>inp.style.setProperty('--fill',((inp.value-p.min)/(p.max-p.min)*100)+'%');fill();
  inp.addEventListener('input',()=>{e.params[key]=parseFloat(inp.value);val.textContent=fmt(inp.value,p.step)+p.unit;fill();});
  ctl.appendChild(lab);ctl.appendChild(inp);ctl.appendChild(val);
  return ctl;
}
function SCHEMA_LABEL(key){
  const map={pattern:'Pattern',repeatType:'Repeat type',mixSpace:'Mix space',edge:'Edge wrap',style:'Style'};
  return map[key]||key;
}

function gradientCtl(e){
  const g=document.createElement('div');g.className='ctl';
  const gr=document.createElement('div');gr.className='grad';
  const lbl=document.createElement('div');lbl.className='glabel';lbl.textContent='Gradient';
  const bar=document.createElement('div');bar.className='bar';
  const stopsWrap=document.createElement('div');stopsWrap.className='stops';
  function paint(){
    const css=e.grad.map(s=>`${s.c} ${Math.round(s.p*100)}%`).join(',');
    bar.style.background=`linear-gradient(90deg,${css})`;
  }
  function rebuildStops(){
    stopsWrap.innerHTML='';
    e.grad.forEach((s,i)=>{
      const st=document.createElement('div');st.className='stop';
      const c=document.createElement('input');c.type='color';c.value=s.c;
      c.addEventListener('input',()=>{s.c=c.value;paint();});
      const sd=document.createElement('span');sd.className='sd';sd.textContent=Math.round(s.p*100);
      st.appendChild(c);st.appendChild(sd);stopsWrap.appendChild(st);
    });
  }
  paint();rebuildStops();
  gr.appendChild(lbl);gr.appendChild(bar);gr.appendChild(stopsWrap);
  g.appendChild(gr);return g;
}

/* add-effect menu */
const addMenu=document.getElementById('addMenu');
Object.keys(SCHEMA).forEach(type=>{
  const b=document.createElement('button');
  b.innerHTML=`<span class="wave">≈</span> ${SCHEMA[type].name}`;
  b.addEventListener('click',()=>{
    const curGrad=(boxes[active].effects.find(x=>x.type==='gradmap')||{}).grad;
    const e=makeEffect(type, type==='gradmap'?{grad:curGrad||GR_TEAL}:undefined);
    boxes[active].effects.unshift(e);
    addMenu.classList.remove('open');buildStack();
  });
  addMenu.appendChild(b);
});
document.getElementById('addBtn').addEventListener('click',ev=>{ev.stopPropagation();addMenu.classList.toggle('open');});
document.addEventListener('click',()=>addMenu.classList.remove('open'));

/* footer actions */
const toast=document.getElementById('toast');
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast._t);showToast._t=setTimeout(()=>toast.classList.remove('show'),1600);}

document.getElementById('pause').addEventListener('click',ev=>{running=!running;ev.target.textContent=running?'Pause':'Play';});
document.getElementById('reset').addEventListener('click',()=>{
  boxes[active]=boxFromCfg(SAVED[active]);
  buildStack();scheduleSave();showToast('Box '+(active+1)+' reset to saved default');
});
document.getElementById('copyall').addEventListener('click',()=>{
  const src=clone(boxes[active].effects);
  for(let i=0;i<4;i++){if(i===active)continue;
    boxes[i].effects=clone(src).map(e=>{e.id=++uid;return e;});}
  scheduleSave();showToast('Copied box '+(active+1)+' → all');
});
document.getElementById('rand').addEventListener('click',()=>{
  boxes[active].effects.forEach(e=>{
    const def=SCHEMA[e.type];
    for(const k in def.params){const p=def.params[k];if(k==='__t')continue;
      if(p.type==='select')e.params[k]=Math.floor(Math.random()*p.options.length);
      else if(p.type==='toggle')e.params[k]=Math.random()>0.5;
      else if(p.type==='color'){}
      else e.params[k]=Math.round((p.min+Math.random()*(p.max-p.min))/p.step)*p.step;
    }
  });
  buildStack();showToast('Randomized box '+(active+1));
});
function serialize(){
  return boxes.map((b,i)=>({box:i+1,layout:b.layout,effects:b.effects.map(e=>({type:e.type,on:e.on,params:e.params,grad:e.grad||undefined}))}));
}
/* auto-save: persist every change to localStorage (works when served over http; harmless otherwise) */
let _saveT=null;
function save(){ try{ localStorage.setItem('dt-glitch-config',JSON.stringify({v:CFG_VERSION,cfg:serialize()})); }catch(_){ } }
function scheduleSave(){ clearTimeout(_saveT); _saveT=setTimeout(save,350); }
stack.addEventListener('input',scheduleSave);   // sliders + colour inputs
stack.addEventListener('change',scheduleSave);  // selects

/* copy another box's effects into the active box */
const copyFrom=document.getElementById('copyFrom');
copyFrom.addEventListener('change',()=>{
  const i=parseInt(copyFrom.value,10); copyFrom.value='';
  if(isNaN(i)||i===active) return;
  boxes[active].effects=clone(boxes[i].effects).map(e=>{e.id=++uid;return e;});
  buildStack(); showToast('Copied Box '+(i+1)+' → Box '+(active+1));
});

/* Lab / Landing view toggle (in-document, no storage needed) */
document.getElementById('lcWord').innerHTML=LOGO_SVG;
const viewSeg=document.getElementById('viewSeg');
function setView(v){
  landingMode=(v==='landing');
  document.body.classList.toggle('landing',landingMode);
  [...viewSeg.children].forEach(b=>b.classList.toggle('act',b.dataset.v===v));
  // best-effort mirror to the standalone index.html when storage is available (served over http)
  if(landingMode) save();
}
[...viewSeg.children].forEach(b=>b.addEventListener('click',()=>setView(b.dataset.v)));

document.getElementById('export').addEventListener('click',()=>{
  const cfg=serialize();
  const json=JSON.stringify(cfg,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='glitch-config.json';a.click();
  URL.revokeObjectURL(url);
  console.log('[glitch-lab] config:\n'+json);
  showToast('Exported glitch-config.json');
});

document.getElementById('gridToggle').addEventListener('click',function(){
  showGrid=!showGrid;this.classList.toggle('on',showGrid);positionLabels();
});

/* init */
selectBox(0);
resize();
requestAnimationFrame(frame);
window.addEventListener('resize',resize);
</script>
